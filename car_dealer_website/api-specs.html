<section class="api-section">
  <h1>Car Specs Lookup</h1>
  <p>Search real vehicle data using API Ninjas.</p>

  <div class="api-search-box">
    <input type="text" id="apiMake" placeholder="Make, example: BMW">
    <input type="text" id="apiModel" placeholder="Model, example: M4">
    <input type="number" id="apiYear" placeholder="Year, example: 2022">
    <button class="hero-btn red-btn" id="apiSearchBtn">Search Specs</button>
  </div>

  <div id="apiLoading" class="api-message">Loading...</div>
  <div id="apiError" class="api-message error-message"></div>
  <div id="apiResults" class="api-results"></div>
</section>
